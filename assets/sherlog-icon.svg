<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0B1023"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92400E"/>
      <stop offset="1" stop-color="#5B2A0A"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A16207"/>
      <stop offset="1" stop-color="#713F12"/>
    </linearGradient>
    <pattern id="plaid" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="36" height="36" fill="url(#hat)"/>
      <rect x="0" y="15" width="36" height="5" fill="#451A03" opacity="0.55"/>
      <rect x="15" y="0" width="5" height="36" fill="#451A03" opacity="0.55"/>
      <rect x="0" y="28" width="36" height="2" fill="#FDE68A" opacity="0.35"/>
      <rect x="28" y="0" width="2" height="36" fill="#FDE68A" opacity="0.35"/>
    </pattern>
    <clipPath id="lens"><circle cx="610" cy="590" r="168"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g transform="translate(-4,-48)">
  <!-- ticket stack -->
  <g filter="url(#shadow)">
    <g transform="rotate(-6 330 330)">
      <rect x="130" y="250" width="440" height="120" rx="22" fill="#CBD5E1"/>
      <rect x="168" y="290" width="40" height="40" rx="9" fill="none" stroke="#64748B" stroke-width="8"/>
      <rect x="236" y="290" width="200" height="16" rx="8" fill="#64748B"/>
      <rect x="236" y="320" width="270" height="12" rx="6" fill="#94A3B8"/>
      <rect x="226" y="304" width="300" height="10" rx="5" fill="#EF4444" opacity="0.85"/>
    </g>
    <g transform="rotate(-3 330 470)">
      <rect x="118" y="410" width="460" height="120" rx="22" fill="#E2E8F0"/>
      <rect x="156" y="450" width="40" height="40" rx="9" fill="#22C55E"/>
      <path d="M165 471 l10 10 l17 -21" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="224" y="450" width="220" height="16" rx="8" fill="#475569"/>
      <rect x="224" y="480" width="290" height="12" rx="6" fill="#94A3B8"/>
    </g>
    <g>
      <rect x="110" y="570" width="470" height="120" rx="22" fill="#F8FAFC"/>
      <rect x="148" y="610" width="40" height="40" rx="9" fill="none" stroke="#F59E0B" stroke-width="8"/>
      <rect x="216" y="610" width="230" height="16" rx="8" fill="#334155"/>
      <rect x="216" y="640" width="300" height="12" rx="6" fill="#94A3B8"/>
    </g>
  </g>

  <!-- magnifier -->
  <g filter="url(#shadow)">
    <line x1="742" y1="722" x2="880" y2="860" stroke="url(#handle)" stroke-width="74" stroke-linecap="round"/>
    <line x1="742" y1="722" x2="790" y2="770" stroke="#F59E0B" stroke-width="80" stroke-linecap="round"/>
    <g clip-path="url(#lens)">
      <rect x="400" y="380" width="420" height="420" fill="#1E293B" opacity="0.55"/>
      <!-- magnified view: a bold check -->
      <path d="M530 600 l55 55 l105 -120" fill="none" stroke="#4ADE80" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="560" cy="520" rx="120" ry="60" fill="#fff" opacity="0.10" transform="rotate(-30 560 520)"/>
    </g>
    <circle cx="610" cy="590" r="168" fill="none" stroke="url(#rim)" stroke-width="46"/>
  </g>

  <!-- deerstalker hat on the lens -->
  <g filter="url(#shadow)" transform="translate(0,4)">
    <!-- back brim -->
    <path d="M700 402 q70 2 96 34 q-56 16 -112 -4 z" fill="#713F12"/>
    <!-- front brim -->
    <path d="M512 410 q-64 4 -92 40 q60 14 116 -14 z" fill="#713F12"/>
    <!-- crown -->
    <path d="M500 420 C500 300 720 288 726 412 C676 436 552 440 500 420 Z" fill="url(#plaid)"/>
    <!-- band -->
    <path d="M500 420 C552 440 676 436 726 412 L722 392 C672 414 556 418 504 398 Z" fill="#422006" opacity="0.6"/>
    <!-- bow on top -->
    <circle cx="612" cy="318" r="14" fill="#422006"/>
  </g>
  </g>
</svg>
